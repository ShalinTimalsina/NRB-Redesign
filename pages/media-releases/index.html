<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/nrb-core.css" />
</head>

<body class="min-w-[1440px] bg-slate-50 text-slate-900 antialiased">
    <div class="nrb-page-frame mx-auto w-full max-w-[1440px]">
        <header class="border-b border-slate-200 bg-[#25295B] px-8 py-6 text-white">
            <div class="mx-auto flex w-full max-w-7xl items-center justify-between">
                <div>
                    <div class="text-xs font-semibold uppercase tracking-[0.22em] text-slate-200">Nepal Rastra Bank
                    </div>
                    <div class="mt-2 text-sm text-slate-300">Digital headquarters</div>
                </div>
            </div>
        </header>
        <main class="mx-auto max-w-7xl px-8 py-16">
            <section class="nrb-section-shell px-0 pb-0">
                <nav aria-label="Breadcrumb" class="nrb-breadcrumb mb-6 flex items-center gap-2">
                    <a href="../../nrb.html" class="font-normal">Home</a>
                    <svg viewBox="0 0 24 24" class="h-4 w-4 flex-none text-slate-400" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m9 18 6-6-6-6" />
                    </svg>
                    <a href="#" class="font-normal">Notices & Media</a>
                    <svg viewBox="0 0 24 24" class="h-4 w-4 flex-none text-slate-400" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m9 18 6-6-6-6" />
                    </svg>
                    <a href="#media" class="font-normal">Media Centre</a>
                    <svg viewBox="0 0 24 24" class="h-4 w-4 flex-none text-slate-400" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m9 18 6-6-6-6" />
                    </svg>
                    <span class="font-medium text-slate-900">Media Releases</span>
                </nav>
                <div class="pb-6">
                    <h1 class="text-2xl font-bold text-slate-900 mb-4">Media Releases</h1>
                    <p class="mt-4 max-w-4xl text-sm leading-6 text-slate-600">Press releases and official statements.
                    </p>
                </div>
            </section>
            <section class="rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
                <h2 class="text-xl font-bold text-slate-900">Press releases and official statements</h2>
                <p class="mt-4 text-sm leading-6 text-slate-600">Scaffold page for media releases, briefings, and public
                    announcements.</p>
            </section>
        </main>
    </div>
</body>

</html>
