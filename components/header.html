<header id="Site-Header" class="bg-[#25295B] text-white shadow-sm font-['IBM_Plex_Sans'] relative z-50">
    <style>
        /* Active nav underline indicator */
        #Primary-Navigation a {
            position: relative;
            padding-bottom: 2px;
        }

        #Primary-Navigation a::after {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            border-radius: 2px 2px 0 0;
            transition: background 150ms;
        }

        #Primary-Navigation a:hover::after,
        #Primary-Navigation a.nrb-nav-active::after {
            background: #138496;
        }

        #Primary-Navigation a.nrb-nav-active {
            color: #ffffff;
        }

        /* Dropdown menu */
        .nrb-dropdown {
            position: relative;
        }

        .nrb-dropdown-panel {
            position: absolute;
            top: calc(100% + 14px);
            left: -16px;
            min-width: 240px;
            background: #ffffff;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.12);
            padding: 8px 0;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px);
            transition: opacity 160ms ease, transform 160ms ease, visibility 160ms;
            z-index: 100;
        }

        .nrb-dropdown:hover .nrb-dropdown-panel,
        .nrb-dropdown:focus-within .nrb-dropdown-panel {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .nrb-dropdown-panel a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 500;
            color: #334155;
            text-transform: none;
            letter-spacing: 0;
            text-decoration: none;
            transition: background 120ms, color 120ms;
        }

        .nrb-dropdown-panel a:hover {
            background: #F1F5F9;
            color: #138496;
        }

        .nrb-dropdown-panel a::after {
            display: none !important;
        }

        .nrb-dropdown-panel .nrb-dd-divider {
            border: none;
            border-top: 1px solid #E2E8F0;
            margin: 6px 0;
        }

        .nrb-dropdown-chevron {
            width: 12px;
            height: 12px;
            transition: transform 200ms;
            flex-shrink: 0;
        }

        .nrb-dropdown:hover .nrb-dropdown-chevron {
            transform: rotate(180deg);
        }
    </style>
